name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.0, v2.1, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build with Gradle
      run: ./gradlew build

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: SpawnElytra v${{ steps.get_version.outputs.VERSION }}
        # Globs instead of a hardcoded name, so a stale/renamed jar can never break this again.
        files: build/libs/*.jar
        # Auto-generated from merged PRs/commits since the previous tag - always accurate,
        # never goes stale like a hand-written list would.
        generate_release_notes: true
        body: |
          **SpawnElytra v${{ steps.get_version.outputs.VERSION }}**

          📋 Full formatted release notes (SpigotMC/Modrinth/CurseForge/Discord): [.github/RELEASE-${{ steps.get_version.outputs.VERSION }}.md](https://github.com/${{ github.repository }}/blob/v${{ steps.get_version.outputs.VERSION }}/.github/RELEASE-${{ steps.get_version.outputs.VERSION }}.md)

          ### Installation
          1. Download `SpawnElytra-${{ steps.get_version.outputs.VERSION }}.jar` below
          2. Place it in your server's `plugins` folder
          3. Restart your server
          4. Configure in `plugins/SpawnElytra/config.yml` and `messages.yml`

          ### Requirements
          - Minecraft 1.20.1+
          - Spigot/Paper or compatible server
          - Java 21+
        draft: false
        prerelease: false
