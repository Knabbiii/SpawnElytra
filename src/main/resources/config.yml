# ===========================================
# SpawnElytra - Configuration
# ===========================================
# Plugin by Knabbiii
#
# Players double-jump near spawn to fly like with an elytra, without needing
# actual elytra wings, then press F (Java) or Sneak (Bedrock) to boost.

# Quick Start
# ===========
# The essentials most servers only need to touch once.

# World where the elytra feature is enabled (exact name, case-sensitive)
world: world

# Radius in blocks around the spawn point where flight can be activated
# Recommended: 25-200 depending on your spawn area size
spawnRadius: 50

# Enable/disable the boost feature (pressing F / Sneak while flying)
boostEnabled: true

# Boost strength - higher = stronger. Recommended: 2-8 (values above 10 may feel too strong)
multiplyValue: 5

# Boost direction:
#   "forward"    - where the player is looking
#   "upward"     - straight up
boostDirection: forward

# Message shown when flight activates - %key% becomes the boost key hint, & for color codes
message: "Press %key% to boost yourself."


# Boost Limits
# ================

# How many times a player can boost during a single flight (default: 1)
totalBoosts: 1

# Cooldown in seconds between boosts, only relevant if totalBoosts is greater than 1
boostToBoostCooldown: 0

# Block using firework rockets to boost while flying via spawn elytra (this plugin's own
# flight mode). Does NOT affect firework use while wearing a real elytra.
disableFireworksInSpawnElytra: true


# Sound & Messages
# ================

# Sound played on boost - any Bukkit Sound enum value, e.g. ENTITY_FIREWORK_ROCKET_BLAST,
# ITEM_ELYTRA_FLYING, ENTITY_ENDER_DRAGON_FLAP (full list: hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html)
boostSound: ENTITY_BAT_TAKEOFF

# Show "Boost activated!" in the action bar when boosting
showBoostMessage: true

# Show the message above (with the boost key hint) when flight activates
showActivationMessage: true


# ==================
# Advanced Settings 
# ==================

# Spawn Area Shape
# ================

# Ignore Y (height) when checking the spawn area - players above/below still count
ignoreYInSpawnRadius: false

# Area shape:
#   "circle"    - spawnRadius around the center point
#   "rectangle" - a box: a custom one if set up below, otherwise a square/cube
#                 with side length 2x spawnRadius
spawnAreaMode: circle

# A custom box and/or center point can be set with /spawnelytra setup and
# /spawnelytra center - stored in area.yml, takes priority over the settings
# above without changing them. Run /spawnelytra info to see what's active.

# Game Mode Restrictions
# ======================

# Disable spawn elytra flight while in Adventure mode
disableInAdventure: false

# Maintenance
# ============

# Anonymous usage statistics via bStats
enableMetrics: true

# Check for updates on Modrinth at startup, notifying console and online ops
checkForUpdates: true

# Verbose save/load logging to console, useful for troubleshooting
debugMode: false

# --- Permissions (defined in plugin.yml, referenced here for clarity) ---
# spawnelytra.use      - Allows using elytra flight (default: true)
# spawnelytra.useboost - Allows using boost functionality (default: true)
# spawnelytra.admin    - Allows admin commands like /spawnelytra reload (default: op)
# spawnelytra.*        - All permissions (default: op)

permissions:
  use: spawnelytra.use
  boost: spawnelytra.useboost
  admin: spawnelytra.admin
